[project]
name = "impulse-mcmc"
dynamic = ["version"]
authors = [
  { name="Aaron D. Johnson", email="aaron9035@gmail.com" },
]
description = "Parallel tempering MCMC with adaptive proposals, NUTS, and reversible-jump model selection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Floors are verified by the floor-pinned CI job; see CHANGELOG.md (2.0.0).
dependencies = [
  "numpy >= 1.24",
  "scipy >= 1.10",
  "tqdm >= 4.60",
]

[project.optional-dependencies]
plots = [
  "matplotlib",
]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "flake8",
  "black>=26",
  "isort>=7",
]
flow = [
  "coppuccino",
]

[project.urls]
Homepage = "https://github.com/AaronDJohnson/impulse_mcmc"
Issues = "https://github.com/AaronDJohnson/impulse_mcmc/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["impulse*"]

[tool.setuptools.package-data]
impulse = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "impulse.__version__"}

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
