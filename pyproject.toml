[project]
name = "impulse-mcmc"
version = "1.0.0"
authors = [
  { name="Aaron D. Johnson", email="aaron9035@gmail.com" },
]
description = "Parallel tempering MCMC with adaptive proposals, NUTS, and reversible-jump model selection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy >= 2.2.2",
  "scipy >= 1.15.1",
  "tqdm >= 4.67.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "flake8",
  "black",
  "isort",
]
flow = [
  "coppuccino",
]

[project.urls]
Homepage = "https://github.com/AaronDJohnson/impulse_mcmc"
Issues = "https://github.com/AaronDJohnson/impulse_mcmc/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["impulse*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
