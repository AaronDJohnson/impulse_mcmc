name: Tests

on:
  pull_request:
    branches: [ main, v2 ]
  push:
    branches: [ main, v2 ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Import smoke test (declared deps only)
      run: python -c "import impulse; print(impulse.__version__)"

    - name: Install test dependencies
      run: pip install pytest pytest-cov

    - name: Run tests (fast suite)
      run: |
        pytest tests/ -v -m "not slow" --cov=impulse --cov-report=xml --cov-report=term --cov-fail-under=87

    # Coverage ENFORCEMENT is --cov-fail-under above (measured 90% after the
    # dead parallel.py was removed and wrapping/SBC tests were added; 87 leaves
    # headroom against per-platform drift). This job does not install the
    # [flow] extra, so impulse/flow_proposals.py reports 0% HERE and is
    # included in that 90% -- it is covered by the slow-tests job, which does
    # install it. The codecov upload is reporting only: one matrix cell, non-blocking,
    # because tokenless v4 uploads are rate-limit flaky. Set a
    # CODECOV_TOKEN secret and fail_ci_if_error: true to harden it.
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Import smoke test (declared deps only)
      run: python -c "import impulse; print(impulse.__version__)"

    - name: Install test dependencies
      # [flow] pulls coppuccino from PyPI. This is the only job that installs
      # it, so it is the only place impulse/flow_proposals.py is executed at
      # all -- everywhere else its tests skip and it reports 0% coverage.
      run: |
        pip install pytest
        pip install -e ".[flow]"

    - name: Run slow tests
      run: |
        pytest tests/ -v -m slow

    - name: Run normalizing-flow tests (optional extra installed)
      run: |
        pytest tests/test_flow_proposals.py -v

  doc-snippets:
    # Every ```python block in README.md and docs/**/*.md is executed. This
    # runs real (short) chains, so it lives outside the fast matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install package with optional extras
      # [flow] as well as [plots]: without it the normalizing-flow snippet is
      # skipped rather than checked, and a break in it would ship unnoticed.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[plots,flow]"

    - name: Execute documentation snippets
      env:
        MPLBACKEND: Agg
      run: python scripts/check_doc_snippets.py

  floor-versions:
    # Verify the declared lower bounds (numpy>=1.24, scipy>=1.10, tqdm>=4.60) still work.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install floor-pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install 'numpy==1.24.*' 'scipy==1.10.*' 'tqdm==4.60.*'

    - name: Install package (keeping floor pins)
      run: pip install -e .

    - name: Import smoke test (floor deps)
      run: python -c "import impulse; print(impulse.__version__)"

    - name: Install test dependencies
      run: pip install pytest

    - name: Run tests (fast suite, no coverage)
      run: |
        pytest tests/ -v -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # numpy/scipy/tqdm so mypy sees real dependency types (numpy ships stubs)
        pip install "black>=26,<27" "isort>=7,<8" flake8 mypy numpy scipy tqdm

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 impulse scripts --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check code formatting with black
      run: |
        black --check impulse tests scripts

    - name: Check import sorting with isort
      run: |
        isort --check-only impulse tests scripts

    - name: Type check with mypy
      run: |
        mypy impulse