name: Deploy to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Import smoke test (declared deps only)
      run: python -c "import impulse; print(impulse.__version__)"

    - name: Install test dependencies
      run: pip install pytest

    - name: Run tests (fast suite)
      run: |
        pytest tests/ -v -m "not slow" --ignore=tests/test_parallel.py

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: ${{ github.event.inputs.environment || 'pypi' }}
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Verify version consistency
      run: |
        WHEEL_VERSION=$(basename dist/*.whl | cut -d- -f2)
        SDIST_VERSION=$(basename dist/*.tar.gz | sed -E 's/\.tar\.gz$//' | rev | cut -d- -f1 | rev)
        echo "Wheel version: $WHEEL_VERSION"
        echo "Sdist version: $SDIST_VERSION"
        if [ "$WHEEL_VERSION" != "$SDIST_VERSION" ]; then
          echo "::error::Wheel version ($WHEEL_VERSION) does not match sdist version ($SDIST_VERSION)"
          exit 1
        fi
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "v$WHEEL_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match built package version (expected v$WHEEL_VERSION)"
            exit 1
          fi
          echo "Release tag $TAG matches built package version"
        fi

    - name: Publish to Test PyPI
      if: github.event.inputs.environment == 'testpypi' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

    - name: Publish to PyPI
      if: github.event_name == 'release' || github.event.inputs.environment == 'pypi'
      uses: pypa/gh-action-pypi-publish@release/v1