name: Docs

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pandoc (required by nbsphinx)
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install package and docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # ipython provides the pygments lexer for notebook code cells
        pip install "sphinx>=8" "myst-parser>=4" "nbsphinx>=0.9" "sphinx-rtd-theme>=3" ipython

    - name: Build HTML docs (warnings are errors)
      # The local build is warning-clean; keep it that way.
      # Notebooks are rendered from stored outputs, never executed
      # (nbsphinx_execute = 'never' in docs/conf.py).
      run: python -m sphinx -b html -W --keep-going docs docs/_build/html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  # Deploy only on pushes to main or v2; PRs stop after the build job.
  # NOTE: requires Pages to be enabled with source "GitHub Actions" in the
  # repository settings (Settings -> Pages -> Build and deployment).
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment origin (OIDC)

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
